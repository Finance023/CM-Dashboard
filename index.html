<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Snackible · CM Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0B0F14;
    --surface1:  #111827;
    --surface2:  #161e2e;
    --surface3:  #1c2640;
    --border:    #2a3f5f;
    --border2:   #334d70;
    --text1:     #ffffff;
    --text2:     #dde6f0;
    --text3:     #a8bdd4;
    --green:     #34d399;
    --green-bg:  rgba(52,211,153,0.08);
    --red:       #f87171;
    --red-bg:    rgba(248,113,113,0.08);
    --red-border:rgba(248,113,113,0.25);
    --blue:      #60a5fa;
    --blue-bg:   rgba(96,165,250,0.08);
    --amber:     #fbbf24;
    --purple:    #a78bfa;
    --radius-sm: 8px;
    --radius:    12px;
    --radius-lg: 16px;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text1);
    min-height: 100vh;
    padding: 0;
  }

  /* ── TOP NAV ── */
  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 32px;
    border-bottom: 0.5px solid var(--border);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .nav-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .nav-logo {
    width: 28px;
    height: 28px;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
  }
  .nav-title { font-size: 14px; font-weight: 500; color: var(--text1); }
  .nav-sub   { font-size: 12px; color: var(--text3); margin-left: 4px; }
  .nav-right { display: flex; align-items: center; gap: 10px; }
  .sync-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    background: var(--surface2);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-sm);
    font-size: 12px;
    color: var(--text2);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .sync-btn:hover { border-color: var(--blue); color: var(--blue); }
  .sync-btn svg { width: 13px; height: 13px; }
  .last-updated { font-size: 11px; color: var(--text3); }

  /* ── MAIN ── */
  .main { padding: 28px 32px 48px; max-width: 1280px; margin: 0 auto; }

  /* ── PAGE HEADER ── */
  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 24px;
  }
  .page-header h1 { font-size: 20px; font-weight: 500; color: var(--text1); }
  .page-header p  { font-size: 13px; color: var(--text3); margin-top: 4px; }

  /* ── MONTH TABS ── */
  .month-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 24px;
    background: var(--surface1);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 5px;
    width: fit-content;
  }
  .month-tab {
    padding: 7px 20px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    color: var(--text3);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    border: none;
    background: none;
  }
  .month-tab.active {
    background: var(--surface3);
    color: var(--text1);
    border: 0.5px solid var(--border2);
  }
  .month-tab:hover:not(.active) { color: var(--text2); }

  /* ── KPI ROW ── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .kpi-card {
    background: var(--surface1);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
  }
  .kpi-label {
    font-size: 11px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: 10px;
  }
  .kpi-value {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.5px;
  }
  .kpi-meta {
    font-size: 12px;
    color: var(--text3);
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
  }
  .badge-green { background: var(--green-bg); color: var(--green); border: 0.5px solid rgba(52,211,153,0.2); }
  .badge-red   { background: var(--red-bg);   color: var(--red);   border: 0.5px solid var(--red-border); }
  .badge-blue  { background: var(--blue-bg);  color: var(--blue);  border: 0.5px solid rgba(96,165,250,0.2); }
  .badge-amber { background: rgba(251,191,36,0.08); color: var(--amber); border: 0.5px solid rgba(251,191,36,0.2); }

  /* ── GRID LAYOUT ── */
  .content-grid {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 16px;
    align-items: start;
  }

  /* ── CARDS ── */
  .card {
    background: var(--surface1);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
  }
  .card-title {
    font-size: 11px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: 18px;
  }

  /* ── WATERFALL ── */
  .wf-section-label {
    font-size: 10px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 6px 0 4px;
    border-bottom: 0.5px solid var(--border);
    margin-bottom: 2px;
  }
  .wf-row {
    display: grid;
    grid-template-columns: 180px 1fr 100px 80px;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 0.5px solid var(--border);
  }
  .wf-row:last-child { border-bottom: none; }
  .wf-row.highlight {
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 9px 12px;
    border: 0.5px solid var(--border2);
    margin: 4px -4px;
  }
  .wf-row.highlight-red {
    background: var(--red-bg);
    border-radius: var(--radius-sm);
    padding: 9px 12px;
    border: 0.5px solid var(--red-border);
    margin: 4px -4px;
  }
  .wf-label { font-size: 13px; color: var(--text2); }
  .wf-label.strong { color: var(--text1); font-weight: 500; }
  .wf-bar-track {
    height: 5px;
    background: var(--surface3);
    border-radius: 3px;
    overflow: hidden;
  }
  .wf-bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
  .wf-amount { font-size: 13px; font-weight: 500; text-align: right; }
  .wf-pct    { font-size: 11px; color: var(--text3); text-align: right; }
  .c-blue   { color: var(--blue); }
  .c-green  { color: var(--green); }
  .c-red    { color: var(--red); }
  .c-amber  { color: var(--amber); }
  .c-purple { color: var(--purple); }
  .c-text2  { color: var(--text2); }

  /* ── RIGHT COLUMN ── */
  .right-col { display: flex; flex-direction: column; gap: 14px; }

  /* ── COST BARS ── */
  .cost-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 0.5px solid var(--border);
  }
  .cost-row:last-child { border-bottom: none; }
  .cost-label { font-size: 12px; color: var(--text2); width: 100px; flex-shrink: 0; }
  .cost-track { flex: 1; height: 5px; background: var(--surface3); border-radius: 3px; overflow: hidden; }
  .cost-fill  { height: 100%; border-radius: 3px; }
  .cost-pct   { font-size: 12px; font-weight: 500; width: 40px; text-align: right; flex-shrink: 0; }
  .cost-total-row {
    display: flex;
    justify-content: space-between;
    padding-top: 10px;
    margin-top: 4px;
    border-top: 0.5px solid var(--border);
  }

  /* ── MIS RECON ── */
  .recon-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 0.5px solid var(--border);
  }
  .recon-row:last-child { border-bottom: none; }
  .recon-label { font-size: 13px; color: var(--text2); }
  .recon-val   { font-size: 14px; font-weight: 500; }
  .delta-card {
    background: var(--red-bg);
    border: 0.5px solid var(--red-border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    margin-top: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .delta-label { font-size: 12px; color: var(--red); }
  .delta-val   { font-size: 16px; font-weight: 600; color: var(--red); }

  /* ── ORDERS ── */
  .orders-card { text-align: center; padding: 20px; }
  .orders-val  { font-size: 36px; font-weight: 600; color: var(--blue); letter-spacing: -1px; }
  .orders-label { font-size: 12px; color: var(--text3); margin-top: 4px; }

  /* ── MARKETING ── */
  .mktg-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 0.5px solid var(--border);
    font-size: 13px;
  }
  .mktg-row:last-child { border-bottom: none; }
  .mktg-label { color: var(--text2); }
  .mktg-val   { font-weight: 500; }

  /* ── LOADING / ERROR ── */
  .state-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 300px;
    gap: 12px;
    color: var(--text3);
    font-size: 14px;
  }
  .spinner {
    width: 24px; height: 24px;
    border: 2px solid var(--border2);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── CHART ── */
  .chart-wrap { position: relative; height: 160px; margin-top: 12px; }
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-brand">
    <div class="nav-logo">S</div>
    <span class="nav-title">Snackible</span>
    <span class="nav-sub">/ CM Dashboard · FY27</span>
  </div>
  <div class="nav-right">
    <span class="last-updated" id="lastUpdated">—</span>
    <button class="sync-btn" onclick="loadData()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v5h5M20 20v-5h-5"/><path d="M4 9a8 8 0 0114.54-3M20 15a8 8 0 01-14.54 3"/></svg>
      Sync
    </button>
  </div>
</nav>

<!-- MAIN -->
<main class="main">
  <div class="page-header">
    <div>
      <h1>Contribution Margin</h1>
      <p>D2C · Shopify · Full P&L waterfall</p>
    </div>
  </div>

  <!-- MONTH TABS -->
  <div class="month-tabs" id="monthTabs"></div>

  <!-- CONTENT -->
  <div id="dashboard">
    <div class="state-wrap"><div class="spinner"></div>Loading data…</div>
  </div>
</main>

<script>
// ─────────────────────────────────────────
// CONFIG — paste your Apps Script Web App URL here
// ─────────────────────────────────────────
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwf8iEKYi0yE5oFfqR9AgAakaYuftkpyc4qpFLeHDt87mYIO49xn918thu72agpWqDxsA/exec';

// ─────────────────────────────────────────
// STATE
// ─────────────────────────────────────────
let allData    = [];
let activeMonth = 0;

// ─────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────
function fmt(n) {
  if (n === null || n === undefined) return '—';
  const abs = Math.abs(n);
  const sign = n < 0 ? '–' : '';
  if (abs >= 100000) return sign + '₹' + (abs / 100000).toFixed(2) + 'L';
  if (abs >= 1000)   return sign + '₹' + (abs / 1000).toFixed(1) + 'K';
  return sign + '₹' + Math.round(abs);
}

function fmtPct(n) {
  if (n === null || n === undefined) return '—';
  return n.toFixed(1) + '%';
}

function pctBar(pct, max, color) {
  const w = Math.min(Math.abs(pct || 0) / max, 100);
  return `<div class="wf-bar-track"><div class="wf-bar-fill" style="width:${w}%;background:${color};"></div></div>`;
}

function colorClass(n) {
  if (n === null || n === undefined) return 'c-text2';
  return n >= 0 ? 'c-green' : 'c-red';
}

// ─────────────────────────────────────────
// LOAD DATA
// ─────────────────────────────────────────
async function loadData() {
  document.getElementById('dashboard').innerHTML =
    '<div class="state-wrap"><div class="spinner"></div>Syncing…</div>';

  try {
    const res  = await fetch(APPS_SCRIPT_URL);
    const json = await res.json();
    if (!json.success) throw new Error(json.error);
    allData = json.months;
    document.getElementById('lastUpdated').textContent =
      'Updated ' + new Date(json.lastUpdated).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
    buildTabs();
    renderMonth(activeMonth);
  } catch (e) {
    document.getElementById('dashboard').innerHTML =
      `<div class="state-wrap">⚠ Could not load data. Check your Apps Script URL.<br><small style="color:var(--text3)">${e.message}</small></div>`;
  }
}

// ─────────────────────────────────────────
// TABS
// ─────────────────────────────────────────
function buildTabs() {
  const wrap = document.getElementById('monthTabs');
  wrap.innerHTML = allData.map((m, i) =>
    `<button class="month-tab ${i === activeMonth ? 'active' : ''}" onclick="switchMonth(${i})">${m.month}</button>`
  ).join('');
}

function switchMonth(i) {
  activeMonth = i;
  buildTabs();
  renderMonth(i);
}

// ─────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────
function renderMonth(i) {
  const d = allData[i];
  if (!d) return;

  const totalMktg = (d.promos || 0) + (d.fbSpends || 0) + (d.whatsappEmail || 0) + (d.google || 0);
  const totalCost = (d.cogs || 0) + (d.de || 0) + (d.labour || 0) + (d.logistic || 0) + (d.commission || 0) + totalMktg + (d.discounts || 0) + (d.returns || 0);
  const totalCostPctGMV = d.gmv ? (totalCost / d.gmv * 100) : 0;

  document.getElementById('dashboard').innerHTML = `

    <!-- KPI ROW -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">GMV</div>
        <div class="kpi-value c-blue">${fmt(d.gmv)}</div>
        <div class="kpi-meta">${d.noOfOrders ? d.noOfOrders.toLocaleString('en-IN') + ' orders' : ''}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Gross Margin</div>
        <div class="kpi-value c-green">${fmt(d.grossMargin)}</div>
        <div class="kpi-meta"><span class="badge badge-green">${fmtPct(d.grossMarginPct)} of net</span></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">CM1</div>
        <div class="kpi-value c-green">${fmt(d.cm1)}</div>
        <div class="kpi-meta"><span class="badge badge-green">${fmtPct(d.cm1Pct)} of net</span></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">CM2</div>
        <div class="kpi-value ${colorClass(d.cm2)}">${fmt(d.cm2)}</div>
        <div class="kpi-meta">
          <span class="badge ${d.cm2 >= 0 ? 'badge-green' : 'badge-red'}">${fmtPct(d.cm2PctNet)} net &nbsp;·&nbsp; ${fmtPct(d.cm2PctGMV)} GMV</span>
        </div>
      </div>
    </div>

    <!-- CONTENT GRID -->
    <div class="content-grid">

      <!-- WATERFALL -->
      <div class="card">
        <div class="card-title">Margin waterfall · ${d.month}</div>

        <div class="wf-section-label">Top line</div>

        <div class="wf-row">
          <span class="wf-label">GMV</span>
          ${pctBar(100, 100, '#60a5fa')}
          <span class="wf-amount c-blue">${fmt(d.gmv)}</span>
          <span class="wf-pct">100%</span>
        </div>
        <div class="wf-row">
          <span class="wf-label">– Discounts</span>
          ${pctBar(d.discountPct, 50, '#f87171')}
          <span class="wf-amount c-red">–${fmt(d.discounts)}</span>
          <span class="wf-pct">${fmtPct(d.discountPct)}</span>
        </div>
        <div class="wf-row">
          <span class="wf-label">– Returns</span>
          ${pctBar(d.returnsPct, 50, '#f87171')}
          <span class="wf-amount c-red">–${fmt(d.returns)}</span>
          <span class="wf-pct">${fmtPct(d.returnsPct)}</span>
        </div>
        <div class="wf-row">
          <span class="wf-label">+ Shipping</span>
          ${pctBar(d.shippingPct, 50, '#34d399')}
          <span class="wf-amount c-green">+${fmt(d.shippingCharges)}</span>
          <span class="wf-pct">${fmtPct(d.shippingPct)}</span>
        </div>
        <div class="wf-row highlight">
          <span class="wf-label strong">Net Sales (Tally)</span>
          ${pctBar(d.netSalesInTally / d.gmv * 100, 100, '#60a5fa')}
          <span class="wf-amount c-blue">${fmt(d.netSalesInTally)}</span>
          <span class="wf-pct">${d.gmv ? fmtPct(d.netSalesInTally / d.gmv * 100) : '—'}</span>
        </div>

        <div class="wf-section-label" style="margin-top:12px">Cost of goods</div>

        <div class="wf-row">
          <span class="wf-label">– COGS</span>
          ${pctBar(d.cogsPct, 100, '#f97316')}
          <span class="wf-amount c-amber">–${fmt(d.cogs)}</span>
          <span class="wf-pct">${fmtPct(d.cogsPct)}</span>
        </div>
        <div class="wf-row">
          <span class="wf-label">– Direct Expenses</span>
          ${pctBar(d.dePct, 100, '#f97316')}
          <span class="wf-amount c-amber">–${fmt(d.de)}</span>
          <span class="wf-pct">${fmtPct(d.dePct)}</span>
        </div>
        <div class="wf-row highlight">
          <span class="wf-label strong">Gross Margin</span>
          ${pctBar(d.grossMarginPct, 100, '#34d399')}
          <span class="wf-amount c-green">${fmt(d.grossMargin)}</span>
          <span class="wf-pct c-green">${fmtPct(d.grossMarginPct)}</span>
        </div>

        <div class="wf-section-label" style="margin-top:12px">Variable ops</div>

        <div class="wf-row">
          <span class="wf-label">– Labour</span>
          ${pctBar(d.labourPct, 100, '#a78bfa')}
          <span class="wf-amount c-purple">–${fmt(d.labour)}</span>
          <span class="wf-pct">${fmtPct(d.labourPct)}</span>
        </div>
        <div class="wf-row">
          <span class="wf-label">– Logistics</span>
          ${pctBar(d.logisticPct, 100, '#a78bfa')}
          <span class="wf-amount c-purple">–${fmt(d.logistic)}</span>
          <span class="wf-pct">${fmtPct(d.logisticPct)}</span>
        </div>
        <div class="wf-row">
          <span class="wf-label">– Commission</span>
          ${pctBar(d.commissionPct, 100, '#a78bfa')}
          <span class="wf-amount c-purple">–${fmt(d.commission)}</span>
          <span class="wf-pct">${fmtPct(d.commissionPct)}</span>
        </div>
        <div class="wf-row highlight">
          <span class="wf-label strong">CM1</span>
          ${pctBar(d.cm1Pct, 100, '#34d399')}
          <span class="wf-amount c-green">${fmt(d.cm1)}</span>
          <span class="wf-pct c-green">${fmtPct(d.cm1Pct)}</span>
        </div>

        <div class="wf-section-label" style="margin-top:12px">Marketing</div>

        <div class="wf-row">
          <span class="wf-label">– Promos / Discounts</span>
          ${pctBar(d.promosPctNet, 100, '#f87171')}
          <span class="wf-amount c-red">–${fmt(d.promos)}</span>
          <span class="wf-pct">${fmtPct(d.promosPctNet)} net</span>
        </div>
        <div class="wf-row">
          <span class="wf-label">– FB Spends</span>
          ${pctBar(d.gmv ? d.fbSpends/d.gmv*100 : 0, 100, '#f87171')}
          <span class="wf-amount c-red">–${fmt(d.fbSpends)}</span>
          <span class="wf-pct">${d.gmv ? fmtPct(d.fbSpends/d.gmv*100) : '—'}</span>
        </div>
        <div class="wf-row">
          <span class="wf-label">– WhatsApp + Email</span>
          ${pctBar(d.gmv ? d.whatsappEmail/d.gmv*100 : 0, 100, '#f87171')}
          <span class="wf-amount c-red">–${fmt(d.whatsappEmail)}</span>
          <span class="wf-pct">${d.gmv ? fmtPct(d.whatsappEmail/d.gmv*100) : '—'}</span>
        </div>
        <div class="wf-row">
          <span class="wf-label">– Google</span>
          ${pctBar(d.gmv ? d.google/d.gmv*100 : 0, 100, '#f87171')}
          <span class="wf-amount c-red">–${fmt(d.google)}</span>
          <span class="wf-pct">${d.gmv ? fmtPct(d.google/d.gmv*100) : '—'}</span>
        </div>
        <div class="wf-row ${d.cm2 < 0 ? 'highlight-red' : 'highlight'}">
          <span class="wf-label strong ${colorClass(d.cm2)}">CM2</span>
          ${pctBar(Math.abs(d.cm2PctGMV || 0), 100, d.cm2 >= 0 ? '#34d399' : '#f87171')}
          <span class="wf-amount ${colorClass(d.cm2)}">${fmt(d.cm2)}</span>
          <span class="wf-pct ${colorClass(d.cm2)}">${fmtPct(d.cm2PctGMV)} GMV</span>
        </div>
      </div>

      <!-- RIGHT COLUMN -->
      <div class="right-col">

        <!-- ORDERS -->
        <div class="card orders-card">
          <div class="orders-val">${d.noOfOrders ? d.noOfOrders.toLocaleString('en-IN') : '—'}</div>
          <div class="orders-label">Orders · ${d.month}</div>
        </div>

        <!-- COST BREAKDOWN -->
        <div class="card">
          <div class="card-title">Cost breakdown · % of GMV</div>
          <div class="cost-row">
            <span class="cost-label">COGS</span>
            <div class="cost-track"><div class="cost-fill" style="width:${Math.min(d.cogsPct||0,100)}%;background:#f97316;"></div></div>
            <span class="cost-pct c-amber">${fmtPct(d.cogsPct)}</span>
          </div>
          <div class="cost-row">
            <span class="cost-label">Logistics</span>
            <div class="cost-track"><div class="cost-fill" style="width:${Math.min(d.logisticPct||0,100)}%;background:#a78bfa;"></div></div>
            <span class="cost-pct c-purple">${fmtPct(d.logisticPct)}</span>
          </div>
          <div class="cost-row">
            <span class="cost-label">Marketing</span>
            <div class="cost-track"><div class="cost-fill" style="width:${Math.min(d.marketingPctGMV||0,100)}%;background:#f87171;"></div></div>
            <span class="cost-pct c-red">${fmtPct(d.marketingPctGMV)}</span>
          </div>
          <div class="cost-row">
            <span class="cost-label">Discounts</span>
            <div class="cost-track"><div class="cost-fill" style="width:${Math.min(d.discountPct||0,100)}%;background:#fbbf24;"></div></div>
            <span class="cost-pct c-amber">${fmtPct(d.discountPct)}</span>
          </div>
          <div class="cost-row">
            <span class="cost-label">Returns</span>
            <div class="cost-track"><div class="cost-fill" style="width:${Math.min(d.returnsPct||0,100)}%;background:#6b7280;"></div></div>
            <span class="cost-pct c-text2">${fmtPct(d.returnsPct)}</span>
          </div>
          <div class="cost-row">
            <span class="cost-label">Labour</span>
            <div class="cost-track"><div class="cost-fill" style="width:${Math.min(d.labourPct||0,100)}%;background:#a78bfa;"></div></div>
            <span class="cost-pct c-purple">${fmtPct(d.labourPct)}</span>
          </div>
          <div class="cost-total-row">
            <span style="font-size:12px;color:var(--text3)">Total cost burden</span>
            <span style="font-size:13px;font-weight:600;" class="c-red">${totalCostPctGMV.toFixed(1)}% of GMV</span>
          </div>
        </div>

        <!-- MARKETING BREAKDOWN -->
        <div class="card">
          <div class="card-title">Marketing · ${d.month}</div>
          <div class="mktg-row">
            <span class="mktg-label">FB Spends</span>
            <span class="mktg-val c-red">${fmt(d.fbSpends)}</span>
          </div>
          <div class="mktg-row">
            <span class="mktg-label">WhatsApp + Email</span>
            <span class="mktg-val c-text2">${fmt(d.whatsappEmail)}</span>
          </div>
          <div class="mktg-row">
            <span class="mktg-label">Google</span>
            <span class="mktg-val c-text2">${fmt(d.google)}</span>
          </div>
          <div class="mktg-row" style="border-bottom:none;padding-top:10px;margin-top:4px;border-top:0.5px solid var(--border);">
            <span class="mktg-label" style="color:var(--text1);font-weight:500;">Total</span>
            <span class="mktg-val c-red">${fmt(totalMktg)}</span>
          </div>
          <div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center;">
            <span style="font-size:12px;color:var(--text3)">ROAS</span>
            <span style="font-size:18px;font-weight:600;color:var(--blue)">${d.roas ? d.roas.toFixed(2) + 'x' : '—'}</span>
          </div>
          <div style="margin-top:6px;display:flex;justify-content:space-between;">
            <span style="font-size:12px;color:var(--text3)">Marketing % GMV</span>
            <span style="font-size:13px;font-weight:500;" class="c-red">${fmtPct(d.marketingPctGMV)}</span>
          </div>
          <div style="margin-top:4px;display:flex;justify-content:space-between;">
            <span style="font-size:12px;color:var(--text3)">Marketing % Net</span>
            <span style="font-size:13px;font-weight:500;" class="c-red">${fmtPct(d.marketingPctNet)}</span>
          </div>
        </div>

        <!-- MIS RECONCILIATION -->
        <div class="card">
          <div class="card-title">MIS Reconciliation · ${d.month}</div>
          <div class="recon-row">
            <span class="recon-label">CM2 (this sheet)</span>
            <span class="recon-val ${colorClass(d.cm2)}">${fmt(d.cm2)}</span>
          </div>
          <div class="recon-row">
            <span class="recon-label">CM2 in MIS</span>
            <span class="recon-val ${colorClass(d.cm2InMIS)}">${fmt(d.cm2InMIS)}</span>
          </div>
          <div class="delta-card">
            <span class="delta-label">Delta (gap)</span>
            <span class="delta-val">${fmt(d.delta)}</span>
          </div>
        </div>

      </div>
    </div>
  `;
}

// ─────────────────────────────────────────
// INIT
// ─────────────────────────────────────────
loadData();
</script>
</body>
</html>
